# 動作モード。local（ローカルモード。ログインなし、127.0.0.1 だけで待ち受ける）か shared（共有モード。docs の OP0007）
mode = "local"

# ノード（Folder 画面のファイル・フォルダ）のルート。back/ からの相対パスか絶対パス。
# お気に入りなどがこのルートからの相対パスで記録されるため、アプリの初期設定でだけ決め、運用中は変えない
folder_root = "../folder"

# 文字認識のモデルのフォルダ（docs の FN0202-BR15）。書かなければ back/models（ビルドのときに用意される）
# ocr_models_dir = "models"
