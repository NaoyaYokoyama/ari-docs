[package]
name = "app"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }
# 文字認識のモデルの確認（back/build_models.rs）
sha2 = "0.10"

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "~2.7"
open = "5.4.2"
toml = "1"
# バックエンド（API・バッチ）を同じプロセスで動かす
back = { path = "../../back" }

# 開発用のビルドでも外部の部品は最適化する（文字認識・PDF の描画・単語の区切りは、最適化しないと数倍遅いため）
[profile.dev.package."*"]
opt-level = 2
