# 配布物のビルドとテスト（docs の OP0002）。Windows（NSIS のインストーラー）と Linux（AppImage）を作り、
# 作ったものを Actions の成果物（Artifacts）に置く。手で動かす（Actions の画面の「Run workflow」）か、v で始まるタグを push したとき
name: build

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            bundle: nsis
          # ONNX Runtime（文字認識）の配布元の完成品は新しい C++ の標準ライブラリ（GCC 13 以降）が要るため 24.04
          - os: ubuntu-24.04
            bundle: appimage
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - name: Linux のライブラリ（Tauri が使う WebKitGTK など）
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libssl-dev libxdo-dev

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: front/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            back
            desktop/src-tauri

      - name: tauri-cli
        run: cargo install tauri-cli --version "^2" --locked

      - name: 画面のビルド
        working-directory: front
        run: |
          npm ci
          npm run build

      # 文字認識のモデル（back/models/）はビルドのときに公式の配布元から取ってくる（back/build_models.rs）
      - name: バックエンドのテスト
        working-directory: back
        run: cargo test

      - name: デスクトップアプリのテスト
        working-directory: desktop/src-tauri
        run: cargo test

      # 文字認識の部品（ONNX Runtime）が使う C++ のランタイムの DLL を、Visual Studio の配布用のフォルダから取り、
      # インストーラーで exe の横に置く（tauri.vcruntime.conf.json を配布物のビルドのときだけ足す）。入っていない PC でも起動できるように（docs の OP0002）
      - name: C++ のランタイムの DLL（Windows）
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -property installationPath
          $version = Get-ChildItem "$vs\VC\Redist\MSVC" -Directory |
            Where-Object { $_.Name -match '^\d+(\.\d+)+$' } |
            Sort-Object { [version]$_.Name } | Select-Object -Last 1
          $crt = Get-ChildItem "$($version.FullName)\x64" -Directory -Filter 'Microsoft.VC*.CRT' | Select-Object -First 1
          if (-not $crt) { throw "C++ のランタイムの配布用のフォルダが見つかりません" }
          $dest = "desktop/src-tauri/vcruntime"
          New-Item -ItemType Directory -Force $dest | Out-Null
          foreach ($name in 'msvcp140.dll', 'msvcp140_1.dll', 'vcruntime140.dll', 'vcruntime140_1.dll') {
            Copy-Item (Join-Path $crt.FullName $name) $dest -ErrorAction Stop
          }
          Get-ChildItem $dest | Format-Table Name, Length

      - name: 配布物のビルド
        working-directory: desktop/src-tauri
        env:
          NO_STRIP: "true"
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            cargo tauri build --bundles nsis --config tauri.vcruntime.conf.json
          else
            cargo tauri build --bundles ${{ matrix.bundle }}
          fi

      - uses: actions/upload-artifact@v5
        with:
          name: ari-docs-${{ matrix.bundle }}
          path: |
            desktop/src-tauri/target/release/bundle/nsis/*.exe
            desktop/src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error
