# 配布物のビルドとテスト（docs の OP0002）。Windows（NSIS のインストーラー）と Linux（AppImage）を作り、
# 作ったものを Actions の成果物（Artifacts）に置く。手で動かす（Actions の画面の「Run workflow」）か、v で始まるタグを push したとき
name: build

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            bundle: nsis
          - os: ubuntu-22.04
            bundle: appimage
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux のライブラリ（Tauri が使う WebKitGTK など）
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev libxdo-dev

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: front/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            back
            desktop/src-tauri

      - name: tauri-cli
        run: cargo install tauri-cli --version "^2" --locked

      - name: 画面のビルド
        working-directory: front
        run: |
          npm ci
          npm run build

      # 文字認識のモデル（back/models/）はビルドのときに公式の配布元から取ってくる（back/build_models.rs）
      - name: バックエンドのテスト
        working-directory: back
        run: cargo test

      - name: デスクトップアプリのテスト
        working-directory: desktop/src-tauri
        run: cargo test

      - name: 配布物のビルド
        working-directory: desktop/src-tauri
        env:
          NO_STRIP: "true"
        run: cargo tauri build --bundles ${{ matrix.bundle }}

      - uses: actions/upload-artifact@v4
        with:
          name: ari-docs-${{ matrix.bundle }}
          path: |
            desktop/src-tauri/target/release/bundle/nsis/*.exe
            desktop/src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error
