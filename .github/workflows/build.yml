# 配布物のビルドとテスト（docs の OP0002）。Windows（NSIS のインストーラー）と Linux（AppImage）を作り、
# 作ったものを Actions の成果物（Artifacts）に置く。手で動かす（Actions の画面の「Run workflow」）か、v で始まるタグを push したとき。
# タグのときは、署名（.sig）と更新の情報（latest.json）も付けて GitHub Releases に載せる（アプリの更新。docs の FN0904）。
# Linux の共有サーバー一式（.tar.gz）も作り、管理者が画面からサーバーを更新できるようにする（FN0904-BR14）
name: build

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            bundle: nsis
          # ONNX Runtime（文字認識）の配布元の完成品は新しい C++ の標準ライブラリ（GCC 13 以降）が要るため 24.04
          - os: ubuntu-24.04
            bundle: appimage
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - name: Linux のライブラリ（Tauri が使う WebKitGTK など）
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libssl-dev libxdo-dev

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: front/package-lock.json

      # Rust は版を決めておく。1.100 からビルドのフォルダの作りが変わり、ort-sys（文字認識）が Windows で
      # DLL を置く先を見つけられずに止まるため（2026-11-24）。上げるときは Windows でも通るかを確かめる
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.96.1"

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            back
            desktop/src-tauri

      - name: tauri-cli
        run: cargo install tauri-cli --version "^2" --locked

      - name: 画面のビルド
        working-directory: front
        run: |
          npm ci
          npm run build

      # 文字認識のモデル（back/models/）はビルドのときに公式の配布元から取ってくる（back/build_models.rs）
      - name: バックエンドのテスト
        working-directory: back
        run: cargo test

      - name: デスクトップアプリのテスト
        working-directory: desktop/src-tauri
        run: cargo test

      # 文字認識の部品（ONNX Runtime）が使う C++ のランタイムの DLL を、Visual Studio の配布用のフォルダから取り、
      # インストーラーで exe の横に置く（tauri.vcruntime.conf.json を配布物のビルドのときだけ足す）。入っていない PC でも起動できるように（docs の OP0002）
      - name: C++ のランタイムの DLL（Windows）
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -property installationPath
          $version = Get-ChildItem "$vs\VC\Redist\MSVC" -Directory |
            Where-Object { $_.Name -match '^\d+(\.\d+)+$' } |
            Sort-Object { [version]$_.Name } | Select-Object -Last 1
          $crt = Get-ChildItem "$($version.FullName)\x64" -Directory -Filter 'Microsoft.VC*.CRT' | Select-Object -First 1
          if (-not $crt) { throw "C++ のランタイムの配布用のフォルダが見つかりません" }
          $dest = "desktop/src-tauri/vcruntime"
          New-Item -ItemType Directory -Force $dest | Out-Null
          foreach ($name in 'msvcp140.dll', 'msvcp140_1.dll', 'vcruntime140.dll', 'vcruntime140_1.dll') {
            Copy-Item (Join-Path $crt.FullName $name) $dest -ErrorAction Stop
          }
          Get-ChildItem $dest | Format-Table Name, Length

      # 署名の鍵（Secrets の TAURI_SIGNING_PRIVATE_KEY・TAURI_SIGNING_PRIVATE_KEY_PASSWORD）があれば、
      # 更新用の署名（.sig）も作る（tauri.updater.conf.json）。無ければ署名なしで作る（タグのときは Releases に載せられない）
      - name: 配布物のビルド
        working-directory: desktop/src-tauri
        env:
          NO_STRIP: "true"
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        shell: bash
        run: |
          args=(--bundles ${{ matrix.bundle }})
          if [ "$RUNNER_OS" = "Windows" ]; then
            args+=(--config tauri.vcruntime.conf.json)
          fi
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            args+=(--config tauri.updater.conf.json)
          else
            echo "::warning::署名の鍵が無いため、更新用の署名（.sig）を作りません"
          fi
          cargo tauri build "${args[@]}"

      # Linux の共有サーバー一式（back・文字認識のモデル・ライセンス）。管理者が画面から更新するときに使う（FN0904-BR14・OP0007）。
      # アプリと同じ鍵で署名する（サーバーは tauri.conf.json の公開鍵で確かめる）
      - name: 共有サーバー一式（Linux）
        if: runner.os == 'Linux'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          cd back
          cargo build --release
          version="$(./target/release/back --version | sed 's/^ari-docs //')"
          mkdir -p ../dist-server/pkg
          cp target/release/back ../dist-server/pkg/
          cp -r models ../dist-server/pkg/
          cp licenses/THIRD_PARTY_NOTICES.txt ../dist-server/pkg/
          cp ../LICENSE ../dist-server/pkg/LICENSE.txt
          archive="../dist-server/ari-docs-server_${version}_linux-x86_64.tar.gz"
          tar -czf "$archive" -C ../dist-server/pkg .
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            cargo tauri signer sign "$archive"
          fi
          rm -rf ../dist-server/pkg

      - uses: actions/upload-artifact@v5
        with:
          name: ari-docs-${{ matrix.bundle }}
          path: |
            desktop/src-tauri/target/release/bundle/nsis/*.exe
            desktop/src-tauri/target/release/bundle/nsis/*.exe.sig
            desktop/src-tauri/target/release/bundle/appimage/*.AppImage
            desktop/src-tauri/target/release/bundle/appimage/*.AppImage.sig
            dist-server/*.tar.gz
            dist-server/*.tar.gz.sig
          if-no-files-found: error
          # 次の release の仕事に渡すだけなので 1 日で消す（1 回で約 250 MB。非公開のリポジトリは置き場所が 500 MB までのため）
          retention-days: 1

  # タグのとき: 配布用の公開リポジトリ（RELEASE_REPO）の GitHub Releases に配布物・署名・latest.json を載せる。
  # ソースのリポジトリは非公開にするため、アプリは RELEASE_REPO の releases/latest/download/latest.json を読む（FN0904-BR02）。
  # RELEASE_REPO に書き込むトークン（Secrets の RELEASE_TOKEN。その公開リポジトリの Contents を書ける細かい権限のトークン）が要る。
  # 移る途中の版のため、このリポジトリの Releases にも同じものを載せる（前の版のアプリはここを見て更新する）
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      RELEASE_REPO: NaoyaYokoyama/ari-docs-releases
    steps:
      - name: 配布用のリポジトリに書き込めるかを確かめる
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::Secrets に RELEASE_TOKEN がありません（$RELEASE_REPO に書き込めるトークンを入れてください）"
            exit 1
          fi
          gh repo view "$RELEASE_REPO" --json name -q .name

      # 変更点を前のタグからのコミットで作るため、履歴とタグもすべて取る
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          path: repo

      - uses: actions/download-artifact@v5
        with:
          path: dist
          merge-multiple: true

      # 変更点（アプリ・サーバーの更新の画面に出す。FN0904-BR13）。前の版のタグからのコミットの題を、
      # 新しい機能（feat）・直したもの（fix）に分けて並べる。それ以外（chore・docs など）は出さない
      - name: 変更点を作る
        env:
          TAG: ${{ github.ref_name }}
        run: |
          cd repo
          prev="$(git describe --tags --abbrev=0 --match 'v*' "$TAG^" 2>/dev/null || true)"
          range="${prev:+$prev..}$TAG"
          section() {
            local lines
            lines="$(git log --no-merges --format='%s' "$range" | sed -n "s/^$1\(([^)]*)\)\?: */- /p")"
            if [ -n "$lines" ]; then
              printf '## %s\n\n%s\n\n' "$2" "$lines"
            fi
          }
          {
            section feat "新しい機能"
            section fix "直したもの"
          } > ../notes.md
          if [ ! -s ../notes.md ]; then
            if [ -n "$prev" ]; then echo "細かな手直し" > ../notes.md; else echo "最初の版です" > ../notes.md; fi
          fi
          cat ../notes.md

      # 成果物はリポジトリからのフォルダの形のまま届く（desktop/src-tauri/target/…・dist-server/）ので、dist の直下に並べ直す
      - name: 配布物と署名を確かめる
        env:
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          find dist -mindepth 2 -type f -exec mv -t dist {} +
          find dist -mindepth 1 -type d -empty -delete
          cd dist
          version="${TAG#v}"
          windows="ari-docs_${version}_x64-setup.exe"
          linux="ari-docs_${version}_amd64.AppImage"
          server="ari-docs-server_${version}_linux-x86_64.tar.gz"
          for file in "$windows" "$linux" "$server"; do
            if [ ! -f "$file" ] || [ ! -f "$file.sig" ]; then
              echo "::error::$file か $file.sig がありません（タグと desktop/src-tauri/Cargo.toml の版がそろっているか、署名の鍵があるかを確かめてください）。ある物: $(ls | tr '\n' ' ')"
              exit 1
            fi
          done

      # 下書きで作り、latest.json を載せてから公開する（latest.json の無い間に、アプリが更新を調べて失敗しないように）。
      # latest.json の中の取り先は、どちらのリポジトリに載せたものも公開の RELEASE_REPO にする
      - name: latest.json を作る
        env:
          TAG: ${{ github.ref_name }}
        run: |
          cd dist
          version="${TAG#v}"
          windows="ari-docs_${version}_x64-setup.exe"
          linux="ari-docs_${version}_amd64.AppImage"
          server="ari-docs-server_${version}_linux-x86_64.tar.gz"
          base="https://github.com/${RELEASE_REPO}/releases/download/${TAG}"
          jq -n \
            --arg version "$version" \
            --rawfile notes ../notes.md \
            --arg date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg wsig "$(cat "$windows.sig")" --arg wurl "$base/$windows" \
            --arg lsig "$(cat "$linux.sig")" --arg lurl "$base/$linux" \
            --arg ssig "$(cat "$server.sig")" --arg surl "$base/$server" \
            '{version: $version, notes: ($notes | rtrimstr("\n")), pub_date: $date, platforms: {
              "windows-x86_64": {signature: $wsig, url: $wurl},
              "linux-x86_64": {signature: $lsig, url: $lurl},
              "server-linux-x86_64": {signature: $ssig, url: $surl}
            }}' > ../latest.json
          cat ../latest.json

      - name: 配布用のリポジトリの Releases に載せる
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" dist/* --repo "$RELEASE_REPO" --title "$TAG" --notes-file notes.md --draft
          gh release upload "$TAG" latest.json --repo "$RELEASE_REPO"
          gh release edit "$TAG" --repo "$RELEASE_REPO" --draft=false

      - name: このリポジトリの Releases にも載せる
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" dist/* --repo "${{ github.repository }}" --title "$TAG" --notes-file notes.md --draft
          gh release upload "$TAG" latest.json --repo "${{ github.repository }}"
          gh release edit "$TAG" --repo "${{ github.repository }}" --draft=false
