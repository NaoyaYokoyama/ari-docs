<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>ari-docs $title$</title>
$for(css)$
<link rel="stylesheet" href="$css$">
$endfor$
</head>
<body>
<section class="cover">
  <img class="cover-icon" src="assets/icon.png" alt="">
  <p class="cover-product">ari-docs</p>
  <h1 class="cover-title">$title$</h1>
$if(subtitle)$
  <p class="cover-subtitle">$subtitle$</p>
$endif$
  <table class="cover-meta">
    <tr><th>対象の版</th><td>$version$</td></tr>
    <tr><th>発行日</th><td>$date$</td></tr>
$if(audience)$
    <tr><th>読む人</th><td>$audience$</td></tr>
$endif$
  </table>
</section>
<nav class="toc">
  <h2>目次</h2>
$toc$
</nav>
<main>
$body$
</main>
</body>
</html>
